apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: "cm9ib3Nob3AK"
  RABBITMQ_DEFAULT_PASS:  "cm9ib3Nob3AxMjMK"
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: rabbitmq
  # Pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: dharma006/rabbitmq:3
        envFrom:
        - secretRef:
           name: rabbitmq


---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: db
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306 # container port